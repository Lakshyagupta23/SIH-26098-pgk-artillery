[pytest]
pythonpath = .
# Default run excludes auth tests (require AUTH_ENABLED=True + DEMO_MODE=true pre-set).
# To run auth tests:
#   Windows: $env:AUTH_ENABLED="True"; $env:DEMO_MODE="true"; pytest -m auth -v
#   Linux:   AUTH_ENABLED=True DEMO_MODE=true pytest -m auth -v
addopts = -m "not auth"
markers =
    auth: tests that require AUTH_ENABLED=True and DEMO_MODE=true set before pytest starts
